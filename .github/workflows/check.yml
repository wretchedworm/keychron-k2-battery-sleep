name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Offline tests
        run: zsh test.sh
      - name: Build Apple silicon app
        env:
          KEYCHRON_SIGNING_IDENTITY: '-'
        run: zsh build.sh
      - name: Verify bundle
        run: codesign --verify --deep --strict build/KeychronMenu.app
